name: HUGO-Assistant CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-check:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, pdo_mysql

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Copy .env for CI
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP syntax (all files)
        run: |
          find app routes config -name "*.php" | xargs -n1 php -l
          echo "✅ All PHP files syntax OK"

      - name: Run Laravel config cache (dry run)
        run: php artisan config:cache
        env:
          APP_ENV: testing
          APP_KEY: base64:placeholder==
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

  notify-deploy:
    name: Trigger Deploy Webhook
    runs-on: ubuntu-latest
    needs: lint-and-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Ping deploy server
        run: |
          echo "✅ CI passed — code is ready on GitHub."
          echo "The local server (Laragon) will auto-pull via the GitHub webhook."
          echo "If webhook isn't configured yet, run deploy.bat manually."
